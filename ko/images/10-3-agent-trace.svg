<svg xmlns="http://www.w3.org/2000/svg" width="640" height="294" viewBox="0 0 640 294" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">Click 실습 세 실행의 도구 호출 순서</title>
<desc id="desc">세 실행의 도구 호출을 왼쪽부터 순서대로 색깔 칸으로 나란히 놓았다. 실행 1은 11번, 실행 2는 7번, 실행 3은 16번 호출했다. 세 실행 모두 두 번째 행동이 코드 수정이고, 그 전에 버그를 재현한 실행은 없다. 실행 1은 첫 코드 수정에서 bytearray 문제까지 고쳤지만 그 앞에 계기가 된 기록이 없다. 실행 2는 셸 스크립트로 테스트 파일을 고쳤다. 실행 3은 테스트가 여러 번 실패한 뒤 그 출력을 보고 bytearray 문제를 고쳤다. 세 실행 모두 최종 보고는 통과다.</desc>
<defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#b7791f"/></marker></defs>
