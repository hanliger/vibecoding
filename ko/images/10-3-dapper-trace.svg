<svg xmlns="http://www.w3.org/2000/svg" width="560" height="640" viewBox="0 0 560 640"
     role="img" aria-labelledby="title desc" lang="ko">
  <title id="title">요청 하나가 지나간 길과 그 길을 구간으로 기록한 모습</title>
  <desc id="desc">위쪽 그림에서 사용자의 요청은 앞단 서버 A로 들어간다. A는 중간 서버 B와 C를 호출하고, C는 다시 뒷단 서버 D와 E를 호출한다. 응답은 같은 길을 거꾸로 돌아온다. 아래쪽 그림은 같은 요청을 다섯 구간으로 기록한 것이다. 구간 1은 A가 받은 요청으로 부른 구간이 없다. 구간 2와 3은 A가 B와 C를 호출한 것으로 부른 구간이 1이다. 구간 4와 5는 C가 D와 E를 호출한 것으로 부른 구간이 3이다. 각 구간은 시작 시각과 끝 시각이 있는 막대로 그려져 있고, 부른 구간 번호를 따라 이으면 나무 모양이 된다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8"
            markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#415666"/>
    </marker>
  </defs>
  <rect width="560" height="640" fill="white"/>

  <g font-family="Noto Sans CJK KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif"
     fill="#192d39">

    <!-- (가) 요청이 서버를 거쳐 가는 길 -->
    <text x="14" y="24" font-size="16" font-weight="bold">(가) 요청 하나가 서버를 거쳐 가는 길</text>

    <g font-size="13" fill="#637783">
      <text x="14" y="132">앞단 서버</text>
      <text x="14" y="212">중간 서버</text>
      <text x="14" y="292">뒷단 서버</text>
    </g>
    <path d="M14 166 H546 M14 246 H546" stroke="#e3e8eb" stroke-width="1"/>

    <!-- 요청(실선) -->
    <g fill="none" stroke="#415666" stroke-width="2" marker-end="url(#arrow)">
      <path d="M273 72 V108"/>
      <path d="M266 146 L170 188"/>
      <path d="M294 146 L390 188"/>
      <path d="M390 226 L332 268"/>
      <path d="M410 226 L468 268"/>
    </g>
    <!-- 응답(점선) -->
    <g fill="none" stroke="#415666" stroke-width="1.5" stroke-dasharray="4 3"
       marker-end="url(#arrow)">
      <path d="M287 108 V72"/>
      <path d="M180 190 L276 148"/>
      <path d="M380 190 L284 148"/>
      <path d="M342 270 L400 228"/>
      <path d="M458 270 L400 228"/>
    </g>

    <g fill="#f4f7f8" stroke="#637783" stroke-width="1.5">
      <rect x="230" y="40" width="100" height="30" rx="5" fill="white"/>
      <rect x="240" y="110" width="80" height="34" rx="12"/>
      <rect x="120" y="190" width="80" height="34" rx="12"/>
      <rect x="360" y="190" width="80" height="34" rx="12"/>
      <rect x="280" y="270" width="80" height="34" rx="12"/>
      <rect x="440" y="270" width="80" height="34" rx="12"/>
    </g>
    <g text-anchor="middle" font-size="16">
      <text x="280" y="61">사용자</text>
      <text x="280" y="133" font-weight="bold">A</text>
      <text x="160" y="213" font-weight="bold">B</text>
      <text x="400" y="213" font-weight="bold">C</text>
      <text x="320" y="293" font-weight="bold">D</text>
      <text x="480" y="293" font-weight="bold">E</text>
    </g>
    <g font-size="13" fill="#415666">
      <text x="266" y="94" text-anchor="end">요청</text>
      <text x="294" y="94">응답</text>
      <text x="196" y="160" text-anchor="end">호출 1</text>
      <text x="364" y="160">호출 2</text>
      <text x="350" y="240" text-anchor="end">호출 3</text>
      <text x="450" y="240">호출 4</text>
    </g>

    <!-- 범례 -->
    <g font-size="12" fill="#637783">
      <path d="M14 330 H44" stroke="#415666" stroke-width="2"/>
      <text x="50" y="334">요청</text>
      <path d="M90 330 H120" stroke="#415666" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="126" y="334">응답</text>
    </g>

    <!-- (나) 같은 요청을 구간으로 기록한 모습 -->
    <text x="14" y="376" font-size="16" font-weight="bold">(나) 같은 요청을 구간으로 기록한 모습</text>

    <!-- 시간 눈금 (20~31) -->
    <path d="M190 392 V600 M222 392 V600 M254 392 V600 M286 392 V600 M317 392 V600
             M349 392 V600 M381 392 V600 M413 392 V600 M445 392 V600 M476 392 V600
             M508 392 V600 M540 392 V600"
          stroke="#e3e8eb" stroke-width="1" stroke-dasharray="2 3"/>
    <path d="M190 612 H542" fill="none" stroke="#415666" stroke-width="1.5"
          marker-end="url(#arrow)"/>
    <text x="546" y="632" font-size="12" fill="#637783" text-anchor="end">시간</text>

    <!-- 나무 연결선 -->
    <path d="M22 430 V493 M22 449 H32 M22 493 H32 M42 518 V581 M42 537 H52 M42 581 H52"
          fill="none" stroke="#94a4ac" stroke-width="1.5"/>

    <!-- 구간 이름과 번호 -->
    <g font-size="13">
      <text x="14" y="410" font-weight="bold">구간 1<tspan dx="8">A가 받은 요청</tspan></text>
      <text x="14" y="425" font-size="11" fill="#637783">부른 구간: 없음</text>
      <text x="36" y="454" font-weight="bold">구간 2<tspan dx="8">A→B 호출</tspan></text>
      <text x="36" y="469" font-size="11" fill="#637783">부른 구간: 1</text>
      <text x="36" y="498" font-weight="bold">구간 3<tspan dx="8">A→C 호출</tspan></text>
      <text x="36" y="513" font-size="11" fill="#637783">부른 구간: 1</text>
      <text x="56" y="542" font-weight="bold">구간 4<tspan dx="8">C→D 호출</tspan></text>
      <text x="56" y="557" font-size="11" fill="#637783">부른 구간: 3</text>
      <text x="56" y="586" font-weight="bold">구간 5<tspan dx="8">C→E 호출</tspan></text>
      <text x="56" y="601" font-size="11" fill="#637783">부른 구간: 3</text>
    </g>

    <!-- 구간 막대: 시작과 끝 시각 -->
    <g fill="#f4f7f8" stroke="#637783" stroke-width="1.5">
      <rect x="190" y="400" width="350" height="26" rx="3"/>
      <rect x="222" y="444" width="64" height="26" rx="3"/>
      <rect x="317" y="488" width="191" height="26" rx="3"/>
      <rect x="349" y="532" width="96" height="26" rx="3"/>
      <rect x="349" y="576" width="127" height="26" rx="3"/>
    </g>
  </g>
</svg>
